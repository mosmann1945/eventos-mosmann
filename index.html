<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Eventos Mosmann</title>
<meta name="description" content="App para vendedores externos solicitarem degustações, consultarem a agenda e acessarem fotos e vídeos de eventos Mosmann.">
<meta name="theme-color" content="#1F5F3A">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eventos">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #F6F3EA;
    --card-logo: #F3EFE6;
    --verde-escuro: #1F5F3A;
    --amarelo: #F5C400;
    --amarelo-escuro: #D9A800;
    --branco: #FFFFFF;
    --sombra: 0 6px 18px rgba(0, 0, 0, 0.12);
    --sombra-texto: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: system-ui, Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    padding: 28px 16px 32px;
  }

  .pagina {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* TOPO */
  .logo-card {
    width: 96px;
    height: 96px;
    background: var(--card-logo);
    border-radius: 22px;
    box-shadow: var(--sombra);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-card img {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }

  .titulo {
    margin: 18px 0 6px;
    font-size: 26px;
    font-weight: 700;
    color: var(--verde-escuro);
    text-align: center;
    line-height: 1.25;
  }

  .subtitulo {
    margin: 0 0 24px;
    font-size: 17px;
    color: #333;
    text-align: center;
  }

  /* BOTÕES PRINCIPAIS */
  .botoes {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .botao {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    min-height: 96px;
    padding: 14px 20px;
    background: var(--amarelo);
    color: var(--branco);
    text-shadow: var(--sombra-texto);
    border-radius: 20px;
    box-shadow: var(--sombra);
    text-decoration: none;
    transition: transform 0.08s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .botao:active {
    transform: scale(0.98);
  }

  .botao-icone {
    font-size: 44px;
    line-height: 1;
    flex-shrink: 0;
    text-shadow: none;
  }

  .botao-texto {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
  }

  .botao-titulo {
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .botao-sub {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
  }

  /* DÚVIDAS E INSTALAR */
  .botao-secundario {
    width: 100%;
    height: 64px;
    border-radius: 20px;
    border: 2px solid var(--amarelo);
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.08s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .botao-secundario:active {
    transform: scale(0.98);
  }

  .botao-duvidas {
    margin-top: 26px;
    background: transparent;
    color: var(--amarelo-escuro);
  }

  #btn-instalar {
    margin-top: 16px;
    background: var(--amarelo);
    color: var(--branco);
    text-shadow: var(--sombra-texto);
    display: none;
  }

  #btn-instalar.visivel {
    display: flex;
  }

  /* RODAPÉ */
  footer {
    margin-top: 32px;
    font-size: 14px;
    color: #777;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="pagina">

    <div class="logo-card">
      <img src="./icon-192.png" alt="Logo Mosmann Alimentos">
    </div>
    <h1 class="titulo">Eventos e Degustações</h1>
    <p class="subtitulo">Escolha o que você quer fazer</p>

    <main class="botoes">
      <a class="botao" href="https://forms.cloud.microsoft/r/qrQ4bPYwGW">
        <span class="botao-icone">📝</span>
        <span class="botao-texto">
          <span class="botao-titulo">Pedir evento</span>
          <span class="botao-sub">Solicitar degustação ou ação</span>
        </span>
      </a>

      <a class="botao" href="https://outlook.office365.com/owa/calendar/1c7eae05247c46edac94d24f4d9da82b@mosmannalimentos.com.br/d35699977e5d4e29b8060fc1c49aab8a77506909330953308/calendar.html">
        <span class="botao-icone">📅</span>
        <span class="botao-texto">
          <span class="botao-titulo">Ver agenda</span>
          <span class="botao-sub">Datas livres e ocupadas</span>
        </span>
      </a>

      <a class="botao" href="https://mosmann.sharepoint.com/:f:/s/Comercial-MosmannAlimentos-EventosMosmann/IgDnAfsbgdqiRami7kCOZh8pAdCH0xpQv6od6iUjagncEm8">
        <span class="botao-icone">📷</span>
        <span class="botao-texto">
          <span class="botao-titulo">Fotos e vídeos</span>
          <span class="botao-sub">Baixar e compartilhar</span>
        </span>
      </a>
    </main>

    <a class="botao-secundario botao-duvidas" href="https://wa.me/5551995629711">
      💬 Dúvidas? Fale com o Marketing
    </a>

    <button id="btn-instalar" class="botao-secundario" type="button">
      📲 Instalar no celular
    </button>

    <footer>Mosmann Alimentos Ltda.<br>2026</footer>

  </div>

  <script>
    // Registra o service worker (necessário para o app ser instalável como PWA)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (err) {
          console.warn("Falha ao registrar o service worker:", err);
        });
      });
    }

    // Mostra o botão "Instalar no celular" somente quando o navegador
    // sinaliza que o app pode ser instalado (evento beforeinstallprompt).
    var promptAdiado = null;
    var btnInstalar = document.getElementById("btn-instalar");

    window.addEventListener("beforeinstallprompt", function (evento) {
      evento.preventDefault();
      promptAdiado = evento;
      btnInstalar.classList.add("visivel");
    });

    btnInstalar.addEventListener("click", function () {
      if (!promptAdiado) return;
      promptAdiado.prompt();
      promptAdiado.userChoice.finally(function () {
        promptAdiado = null;
        btnInstalar.classList.remove("visivel");
      });
    });

    window.addEventListener("appinstalled", function () {
      btnInstalar.classList.remove("visivel");
      promptAdiado = null;
    });
  </script>

</body>
</html>
