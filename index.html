<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Eventos Mosmann</title>
<meta name="description" content="App para vendedores externos solicitarem degustações, consultarem a agenda e acessarem fotos e vídeos de eventos Mosmann.">
<meta name="theme-color" content="#1F5F3A">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eventos">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #F6F3EA;
    --verde-escuro: #1F5F3A;
    --verde-medio: #2E7D4F;
    --amarelo: #F5C400;
    --texto-escuro: #262220;
    --texto-claro: #FFFFFF;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--texto-escuro);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
  }

  .topo {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 20px;
  }

  .logo {
    width: 136px;
    height: 136px;
    border-radius: 24px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    margin-bottom: 14px;
    object-fit: cover;
  }

  .titulo {
    font-size: 26px;
    font-weight: 800;
    color: var(--verde-escuro);
    margin: 0 0 6px;
    line-height: 1.25;
  }

  .subtitulo {
    font-size: 17px;
    color: #4a4540;
    margin: 0;
  }

  .botoes {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 10px;
  }

  .botao {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    min-height: 96px;
    padding: 14px 20px;
    border-radius: 18px;
    border: none;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .botao:active {
    transform: scale(0.98);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  .botao-icone {
    font-size: 40px;
    line-height: 1;
    flex-shrink: 0;
    width: 52px;
    text-align: center;
  }

  .botao-texto {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
  }

  .botao-titulo {
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1.15;
  }

  .botao-sub {
    font-size: 16px;
    font-weight: 500;
    opacity: 0.92;
    line-height: 1.25;
  }

  .botao-amarelo {
    background: var(--amarelo);
    color: var(--texto-escuro);
  }

  .botao-verde-escuro {
    background: var(--amarelo);
    color: var(--texto-claro);
  }

  .botao-verde-medio {
    background: var(--verde-medio);
    color: var(--texto-claro);
  }

  .botao-contorno {
    width: 100%;
    max-width: 480px;
    margin-top: 26px;
    min-height: 64px;
    padding: 12px 20px;
    border-radius: 16px;
    border: 2px solid var(--verde-escuro);
    background: transparent;
    color: var(--verde-escuro);
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .botao-contorno:active {
    background: rgba(31, 95, 58, 0.08);
  }

  #btn-instalar {
    width: 100%;
    max-width: 480px;
    margin-top: 16px;
    min-height: 64px;
    padding: 12px 20px;
    border-radius: 16px;
    border: none;
    background: var(--verde-medio);
    color: var(--texto-claro);
    font-size: 17px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    -webkit-tap-highlight-color: transparent;
  }

  #btn-instalar.visivel {
    display: flex;
  }

  footer {
    margin-top: 36px;
    font-size: 14px;
    color: #776f63;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="topo">
    <img class="logo" src="./icon-192.png" alt="Logo Mosmann Alimentos">
    <h1 class="titulo">Eventos e Degustações</h1>
    <p class="subtitulo">Escolha o que você quer fazer</p>
  </div>

  <main class="botoes">
    <a class="botao botao-amarelo" href="https://forms.cloud.microsoft/r/qrQ4bPYwGW" target="_blank" rel="noopener">
      <span class="botao-icone">📝</span>
      <span class="botao-texto">
        <span class="botao-titulo">Pedir evento</span>
        <span class="botao-sub">Solicitar degustação ou ação</span>
      </span>
    </a>

    <a class="botao botao-verde-escuro" href="https://outlook.office365.com/owa/calendar/1c7eae05247c46edac94d24f4d9da82b@mosmannalimentos.com.br/d35699977e5d4e29b8060fc1c49aab8a77506909330953308/calendar.html" target="_blank" rel="noopener">
      <span class="botao-icone">📅</span>
      <span class="botao-texto">
        <span class="botao-titulo">Ver agenda</span>
        <span class="botao-sub">Datas livres e ocupadas</span>
      </span>
    </a>

    <a class="botao botao-verde-medio" href="https://mosmann.sharepoint.com/:f:/s/Comercial-MosmannAlimentos-EventosMosmann/IgDnAfsbgdqiRami7kCOZh8pAdCH0xpQv6od6iUjagncEm8" target="_blank" rel="noopener">
      <span class="botao-icone">📸</span>
      <span class="botao-texto">
        <span class="botao-titulo">Fotos e vídeos</span>
        <span class="botao-sub">Baixar e compartilhar</span>
      </span>
    </a>
  </main>

  <a class="botao-contorno" href="https://wa.me/5551995629711" target="_blank" rel="noopener">
    💬 Dúvidas? Fale com o Marketing
  </a>

  <button id="btn-instalar" type="button">
    📲 Instalar no celular
  </button>

  <footer>
    Mosmann Alimentos Ltda.<br>
    2026
  </footer>

  <script>
    // Registra o service worker (necessário para o app ser instalável como PWA)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (err) {
          console.warn("Falha ao registrar o service worker:", err);
        });
      });
    }

    // Mostra o botão "Instalar no celular" somente quando o navegador
    // sinaliza que o app pode ser instalado (evento beforeinstallprompt).
    var promptAdiado = null;
    var btnInstalar = document.getElementById("btn-instalar");

    window.addEventListener("beforeinstallprompt", function (evento) {
      evento.preventDefault();
      promptAdiado = evento;
      btnInstalar.classList.add("visivel");
    });

    btnInstalar.addEventListener("click", function () {
      if (!promptAdiado) return;
      promptAdiado.prompt();
      promptAdiado.userChoice.finally(function () {
        promptAdiado = null;
        btnInstalar.classList.remove("visivel");
      });
    });

    window.addEventListener("appinstalled", function () {
      btnInstalar.classList.remove("visivel");
      promptAdiado = null;
    });
  </script>

</body>
</html>
